name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The server runs on Linux hosts, where it reads /proc and drives tmux:
  # checked there, with a real tmux for the launch tests.
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace

  # On a Mac it reads the process table through the kernel's own calls and
  # runs as a launchd agent: checked there too, with Homebrew's tmux.
  server-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2

      - name: Install tmux
        run: brew install tmux

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --locked --workspace

  # The plugin, checked by Claude Code itself: what it hooks and calls, then
  # its tests (the panes and dialogs against a fake host, on terminal and desktop).
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: claude plugin validate
        run: claude plugin validate plugin

      - name: claude plugin test
        run: claude plugin test plugin
