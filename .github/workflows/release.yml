name: Release

# Push a tag `v<version>` (the workspace's and the plugin's version) to build
# the server for Linux and macOS and publish a release with it. The plugin installs from
# the repository itself, through its marketplace.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Linux: statically linked (musl), so it runs on any distribution. Each
  # built natively, named for what `uname -m` says there.
  server:
    strategy:
      matrix:
        include:
          - name: x86_64-linux
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - name: aarch64-linux
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          - name: arm64-macos
            target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          key: server-${{ matrix.name }}

      # ring compiles C with musl-gcc for the musl target.
      - name: Install musl
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --locked -p remote-control-conductor-server --target ${{ matrix.target }}

      - name: Package
        run: |
          out=remote-control-conductor-server-${{ matrix.name }}
          cp target/${{ matrix.target }}/release/remote-control-conductor-server "$out"
          "./$out" --version
          shasum -a 256 "$out" > "$out.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.name }}
          path: remote-control-conductor-server-*

  # One release with both servers, never one without all its files.
  publish:
    needs: server
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: server-*
          merge-multiple: true

      - name: Publish
        run: |
          gh release create "$GITHUB_REF_NAME" remote-control-conductor-server-* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "$(cat <<'NOTES'
          **Claude Code plugin:** `claude plugin marketplace add marcusadolfsson/remote-control-cli-servers`, then `claude plugin install remote-control-cli-servers@remote-control-cli-servers`.

          **Linux host:** the server for x86_64 or arm64, then its setup:

          ```sh
          mkdir -p ~/.local/bin && curl -fsSL https://github.com/marcusadolfsson/remote-control-cli-servers/releases/latest/download/remote-control-conductor-server-$(uname -m)-linux -o ~/.local/bin/remote-control-conductor-server && chmod +x ~/.local/bin/remote-control-conductor-server
          remote-control-conductor-server setup
          ```

          **This Mac** (Apple silicon): the macOS server, set up by the Remote Control Conductor app, or by hand the same way with `remote-control-conductor-server-arm64-macos` and `brew install tmux` first.

          Each server binary has a `.sha256` beside it.
          NOTES
          )"
